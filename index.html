<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Omega Beats</title>
    <!-- Enlace al archivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <!-- LOGO: Asegúrate de que el nombre de tu imagen coincida con el src -->
        <div class="logo-section">
            <img src="https://www.dropbox.com/scl/fi/6e7qxx06cip1720viw4zt/Omega.png?rlkey=pujvgx4l2w9cl3c2wiyk0tbgf&st=t450eaz9&raw=1" alt="Omega Beats Logo">
        </div>

        <!-- BOTÓN DE DESCARGA: Cambia el '#' por el enlace real de tu App -->
        <a href="https://apk.e-droid.net/apk/app4183393-bd2q7x.apk?v=3" class="download-btn" download>Descargar</a>

        <!-- SECCIÓN COMPARTIR -->
        <div class="share-section">
            <p>COMPARTIR</p>
            <!-- El botón llama a la función en JavaScript -->
            <button class="share-btn" onclick="compartirApp()">
                <!-- Icono de compartir en formato SVG -->
                <svg viewBox="0 0 24 24">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
            </button>
        </div>

    </div>

    <!-- Enlace al archivo de JavaScript (va al final para que cargue más rápido) -->
    <script src="script.js"></script>
</body>
</html>
